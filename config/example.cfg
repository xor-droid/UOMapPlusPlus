# UOMapPlusPlus (uomappp) example configuration
#
# INI-like "key = value". Lines starting with '#' or ';' are comments.
# Keys mirror the CLI long options; '-' and '_' are interchangeable.
# Precedence: built-in defaults < this file < command-line flags.
# NOTE: uomappp never reads environment variables. Everything is here or on
# the command line.

# Master seed. Same seed + same build => byte-identical output.
seed = 42

# Facet / file index -> map<N>.mul, staidx<N>.mul, statics<N>.mul
map = 0

# Dimensions in tiles (each must be a multiple of 8).
# Or set 'preset = felucca' (7168x4096) / 'preset = test' (1024x1024) /
# 'preset = britannia' (felucca size, calibrated to the real Felucca map).
width  = 1024
height = 1024
# preset = felucca

# Landmasses: exact number of continents, positions randomized by the seed.
# continent_count enables multi-continent mode (like the CLI flag).
# continent_count = 3     # exact number of continents (implies continents)
# continent_fill  = 1.0   # continent size vs map (~0.8 distinct, ~1.4 merges)

# Output directory (created if missing).
out = ./out

# Terrain shaping ---------------------------------------------------------
sea_level  = 0.0      # elevation noise threshold for water, [-1, 1]
frequency  = 0.004    # base noise frequency (smaller = larger landmasses)
octaves    = 5        # fBm octaves (more = more detail)
max_slope  = 4        # max z step between adjacent land tiles (navigability)
land_z_max = 45       # highest land z produced from elevation (0..127)
water_z    = -5       # flat z assigned to water cells

# Reference client asset used only to sanity-check tile flags (optional).
tiledata = ./ref/UONewDawn/tiledata.mul

# Enrichment (all ON by default) -----------------------------------------
biomes            = true      # climate biomes (snow poles, desert/jungle equator)
temperature_bias  = 0.0       # shift climate warmer(+)/colder(-)
vegetation        = true      # place tree/rock/plant statics
tree_density      = 0.08      # 0..1 fraction of eligible cells with a tree
rock_density      = 0.02      # 0..1 rocks/boulders on hills/mountains
plant_density     = 0.05      # 0..1 ground cover (plants/flowers/ferns)
beaches           = true      # sloped sand beaches around all coasts
beach_width       = 4         # beach band width in tiles
rivers            = true      # downhill meandering rivers (set false to disable)
lakes             = true      # ponds at inland river sinks
passes            = true      # carve walkable passes through mountains
# mountain_slope   = 0         # grade every mountain perimeter N tiles into foothills (0=sharp walls)

# Hydraulic erosion (ON by default) ---------------------------------------
# Droplet erosion carves valleys/drainage into the relief BEFORE rivers, so
# rivers follow the eroded drainage.
erosion            = true     # master toggle (set false to disable)
# erosion_density    = 0.20   # droplets = density * width * height
# erosion_lifetime   = 30     # max steps per droplet
# erosion_radius     = 3      # erosion brush radius (tiles)
# erosion_erode      = 0.30   # 0..1 erosion rate per step
# erosion_deposition = 0.30   # 0..1 sediment deposition rate
# erosion_z_scale    = 1.0    # how strongly eroded relief folds back into z

# Voronoi regions (ON by default) -----------------------------------------
# Partition the map into Voronoi territories, each with its own climate, so
# biomes become organic patches instead of latitude bands. Changes output.
regions            = true     # master toggle (set false to disable)
# region_spacing     = 64     # territory size: site spacing in tiles
# region_jitter      = 0.6    # 0..1 site jitter within its grid cell

# WFC biome transitions (OFF; needs regions) ------------------------------
# Assign each territory a biome so neighbours only meet along legal transitions
# (grass is the universal glue; desert never touches snow). Implies regions.
wfc                = true     # implies regions; set false to disable
# Cellular-automata forest clumps (OFF) -----------------------------------
cellular           = true     # forest clumps; set false to disable
# cellular_fill       = 0.42  # 0..1 forest random-fill probability
# cellular_iterations = 4     # CA smoothing iterations

# Towns / roads / buildings (OFF) -----------------------------------------
# Poisson-disc town sites, an MST + A* road network (bridging rivers), BSP
# building footprints, and L-system side-trails. Changes output.
towns              = false
# town_spacing       = 160    # min distance between towns (tiles)
# town_size          = 48     # town footprint size (tiles)
# trails             = true   # L-system side-trails from towns

# Detail / polish ---------------------------------------------------------
region_warp        = 12       # Voronoi border domain-warp (tiles; 0 = crisp polygons)
dither             = true     # stipple biome borders into soft transitions
# dither_strength    = 0.35   # 0..1 fraction of border cells to swap
resources          = false    # Poisson-disc ore nodes on hills / mountain feet
# resource_spacing   = 120    # min distance between resource nodes (tiles)
cliffs             = false    # varied mountain rock tiles + cliff-face rock statics

# Playability -------------------------------------------------------------
connect            = false    # carve passes/bridges so no land is cut off
# causeways          = true   # false = never bridge the open sea (keep islands); still bridge rivers + carve passes
# connect_max        = 6000   # max barrier-crossing cost (keeps oceans between continents)
# pass_width         = 10     # carved-pass valley half-width (default 10 = ~20 tiles wide)
# pass_slope         = 8      # grade rock down to the carved valley floor (0 = sharp cliff)
clearings          = false    # reserve flat, vegetation-free building plots
# clearing_spacing   = 140    # min distance between clearings (tiles)
# clearing_size      = 10     # clearing radius (tiles)

# Britannia calibration ---------------------------------------------------
# Flatten land into plateaus (measured from the real Felucca map: ~81% of
# adjacent land tiles share the same z). Without this, noise-driven z looks
# "noisy" rather than like Britannia. 'preset = britannia' enables this plus a
# full set of calibrated values (continent/sea-level/mountains/regions/...).
terrace            = false
# terrace_step       = 5      # z quantization step for terraces
# plain_z            = 3      # land within +/-plain_z of 0 snaps flat to 0

# Optional outputs --------------------------------------------------------
preview      = ./out/preview.png   # comment out to skip the final PNG
emit_mapdef  = true                # write map-definitions.snippet.json
terrain_only = false               # true = skip staidx/statics

# Pipeline previews & install ---------------------------------------------
# pass_previews    = true          # write pass<NN>_<name>.png after each pass
# pass_preview_dir = ./out/passes  # where pass PNGs go (default: the output dir)
# install_dir      = /mnt/c/UO/client  # copy the final .mul triplet into the
                                    # directory UOFiddler/ModernUO loads from
